# dsh-skill-evolution bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published package: when the
# plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-skill-evolution
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-skill-evolution` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like a manual cordis.patch.yml mount line. No profile
# file edits needed — one command installs and mounts.
#
# If the profile still carries a manual mount line for this plugin in its own
# cordis.patch.yml, remove it before switching to the bundle channel to avoid
# double-mounting (two host halves, two settings sections).
#
# Tunables (all optional — add under `config:` of the inserted row):
#   minToolCalls            complexity signal threshold (default 5)
#   minPatternOccurrences   repetition signal threshold (default 3)
#   minSuccessRate          repetition signal success floor (default 0.7)
#   autoRegister            register crystallized skills into the catalog (default true)
#   llmProvider / llmModel  reviewer model (defaults: deepseek / deepseek-chat)
#   signals: {complex, recovered, repeated}  toggle individual signals
#   complexRequiresCorroboration  lone complex signal needs recovered/repeated
#                                 corroboration before review (default true)
#   skillLanguage           generated-skill prose language: zh or en (default en)
- insert:
  - id: 'skill-evolution'
    name: 'dsh-skill-evolution'
    config:
      minToolCalls: 5
      minPatternOccurrences: 3
      autoRegister: true
